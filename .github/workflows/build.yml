name: Build test APK

on:
  push:
    # training work (Kaggle jobs, results, voice pack) doesn't change the app: no new build, no phone update
    paths-ignore: ['kaggle/**', 'results/**', 'voicepack/**', '.github/workflows/kaggle.yml', '.github/workflows/voice-pack.yml', '**.md']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools ndk;27.2.12479018 cmake;3.22.1'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build the APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPORTS_TOKEN: ${{ secrets.REPORTS_TOKEN }}
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: spoken-english-test-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish the APK for in-app updates
        if: env.HAS_RELEASE_TOKEN == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          CODE=$((100 + GITHUB_RUN_NUMBER))
          cp app/build/outputs/apk/debug/app-debug.apk spoken-english.apk
          printf '%s\n' "$NOTES" > notes.txt
          gh release create "v$CODE" spoken-english.apk \
            -R 28thanujaya-hash/spoken-english-updates \
            --title "Build $GITHUB_RUN_NUMBER" \
            --notes-file notes.txt --latest
